name: Build Khittara Myanmar Offline AI Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:


jobs:
  build-android:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Source Code
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Setup Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ==========================================
      # 5. Install Android SDK + NDK
      # ==========================================
      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;26.1.10909125"

          yes | sdkmanager --licenses || true


      # ==========================================
      # 6. Setup Android Environment
      # ==========================================
      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # ==========================================
      # 7. Verify Java / Node / Android
      # ==========================================
      - name: Verify Build Environment
        run: |
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "NODE"
          echo "=========================================="
          node --version

          echo ""
          echo "=========================================="
          echo "NPM"
          echo "=========================================="
          npm --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="
          echo "$ANDROID_NDK_HOME"


      # ==========================================
      # 8. Install Node Dependencies
      # ==========================================
      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps


      # ==========================================
      # 9. Force Install React Native Metro
      # ==========================================
      - name: Install React Native Metro Dependencies
        run: |
          npm install \
            --save-dev \
            --legacy-peer-deps \
            @react-native/metro-config@0.76.6 \
            @react-native-community/cli@15.0.1 \
            @react-native-community/cli-platform-android@15.0.1 \
            @react-native-community/cli-platform-ios@15.0.1


      # ==========================================
      # 10. Verify React Native Packages
      # ==========================================
      - name: Verify React Native Packages
        run: |
          echo "=========================================="
          echo "React Native"
          echo "=========================================="

          node -p "require('react-native/package.json').version"

          echo ""
          echo "=========================================="
          echo "Metro Config"
          echo "=========================================="

          node -p "require('@react-native/metro-config/package.json').version"

          echo ""
          echo "=========================================="
          echo "Community CLI"
          echo "=========================================="

          node -p "require('@react-native-community/cli/package.json').version"

          echo ""
          echo "=========================================="
          echo "Metro Config File"
          echo "=========================================="

          test -f metro.config.js

          echo "metro.config.js FOUND"


      # ==========================================
      # 11. Test Metro Config
      # ==========================================
      - name: Test Metro Configuration
        run: |
          node -e "require('./metro.config.js'); console.log('Metro configuration loaded successfully')"


      # ==========================================
      # 12. Generate Gradle Wrapper
      # ==========================================
      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          curl -L \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip

          ./gradle-8.10.2/bin/gradle wrapper \
            --gradle-version 8.10.2

          chmod +x gradlew


      # ==========================================
      # 13. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew --version


      # ==========================================
      # 14. Build React Native JS Bundle
      # ==========================================
      - name: Build JS Bundle
        run: |
          mkdir -p android/app/src/main/assets

          mkdir -p android/app/src/main/res

          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --config metro.config.js


      # ==========================================
      # 15. Verify JS Bundle
      # ==========================================
      - name: Verify JS Bundle
        run: |
          echo "=========================================="
          echo "Checking JS Bundle"
          echo "=========================================="

          if [ ! -f android/app/src/main/assets/index.android.bundle ]; then
            echo "ERROR: JS Bundle was NOT created!"
            exit 1
          fi

          ls -lh android/app/src/main/assets/index.android.bundle

          echo ""
          echo "JS BUNDLE CREATED SUCCESSFULLY!"


      # ==========================================
      # 16. Clean Android
      # ==========================================
      - name: Clean Android Build
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x gradlew

          ./gradlew clean \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 17. Build Release APK
      # ==========================================
      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 18. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          ls -lah android/app/build/outputs/apk/release/

          if ! ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK was NOT generated!"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL!"
          echo "=========================================="


      # ==========================================
      # 19. Upload APK Artifact
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khittara-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
