name: Build Khittara Myanmar Offline AI Android APK
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: android-actions/setup-android@v3
      - name: Install NDK 26.1 & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34"
      - run: npm install --legacy-peer-deps
      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Khittara-AI-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk