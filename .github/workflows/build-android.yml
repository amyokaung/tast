name: Build Khittara Myanmar Offline AI Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Auto-Generate Missing Android Project & Gradle Files
        run: |
          mkdir -p android/app/src/main/java/com/khittara/offlinemai
          mkdir -p android/app/src/main/res/values

          # 1. Generate settings.gradle
          cat << 'EOF' > android/settings.gradle
          rootProject.name = 'KhittaraAI'
          include ':app'
          EOF

          # 2. Generate android/build.gradle with React Native Plugin Path
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10")
                  classpath("com.facebook.react:react-native-gradle-plugin")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url("$rootDir/../node_modules/react-native/android") }
                  maven { url("$rootDir/../node_modules/jsc-android/dist") }
              }
          }
          EOF

          # 3. Generate android/app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'com.facebook.react'

          android {
              compileSdkVersion 34
              namespace "com.khittara.offlinemai"

              defaultConfig {
                  applicationId "com.khittara.offlinemai"
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-O3 -std=c++17 -frtti -fexceptions"
                          arguments "-DANDROID_STL=c++_shared"
                          abiFilters "arm64-v8a", "x86_64"
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file("../../cpp/CMakeLists.txt")
                      version "3.22.1"
                  }
              }
          }
          EOF

          # 4. Generate AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_DOCUMENTS" />
              <application
                  android:label="Khittara AI"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.3-bin.zip -o gradle-8.3-bin.zip
          unzip -q gradle-8.3-bin.zip
          ./gradle-8.3/bin/gradle wrapper --gradle-version 8.3
          chmod +x gradlew

      - name: Build JS Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ || true

      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khittara-AI-Release-APK
          path: android/app/build/outputs/apk/release/
